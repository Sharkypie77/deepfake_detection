version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    networks: [deepfake_network]

  postgres:
    image: postgres:15-alpine
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepfake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-deepfake_detection}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [deepfake_network]

  backend:
    build: {context: ., dockerfile: Dockerfile.cpu}
    env_file: [.env]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql://deepfake:${POSTGRES_PASSWORD}@postgres:5432/deepfake_detection
      DEVICE: cpu
    ports: ["8000:8000"]
    depends_on: [redis, postgres]
    volumes: ["./uploads:/app/uploads", "./results:/app/results", "./models:/app/models"]
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks: [deepfake_network]

  celery_worker:
    build: {context: ., dockerfile: Dockerfile.cpu}
    env_file: [.env]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql://deepfake:${POSTGRES_PASSWORD}@postgres:5432/deepfake_detection
      DEVICE: cpu
    depends_on: [redis, postgres]
    volumes: ["./uploads:/app/uploads", "./results:/app/results", "./models:/app/models"]
    command: celery -A celery_tasks worker --loglevel=info --concurrency=2
    networks: [deepfake_network]

volumes:
  redis_data:
  postgres_data:

networks:
  deepfake_network:
    driver: bridge
